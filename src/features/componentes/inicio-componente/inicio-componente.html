<div class="contenido">
  <h1>Festivos de Colombia</h1>
  <p>Aplicación para administrar y consultar los días festivos.</p>

  <div class="tarjetas">
    @for (seccion of secciones; track seccion.ruta) {
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-icon mat-card-avatar>{{ seccion.icono }}</mat-icon>
          <mat-card-title>{{ seccion.titulo }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ seccion.descripcion }}</p>
        </mat-card-content>
        <mat-card-actions>
          <a matButton="tonal" [routerLink]="seccion.ruta">Ir</a>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>

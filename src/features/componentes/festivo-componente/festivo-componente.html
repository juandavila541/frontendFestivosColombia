<mat-toolbar class="barraTituloCRUD">
  <mat-icon>celebration</mat-icon>
  <span>Festivos</span>
</mat-toolbar>

<div class="contenido">
  <div class="barraBusqueda">
    <mat-form-field appearance="fill">
      <mat-label>Opción de Búsqueda</mat-label>
      <mat-select [(value)]="indiceBusqueda">
        @for (opcion of opcionesBusqueda; track opcion; let i = $index) {
          <mat-option [value]="i">{{ opcion }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="textoBusqueda" (keyup.enter)="buscar()">
    </mat-form-field>
    <button matButton="filled" (click)="buscar()"><mat-icon>search</mat-icon>Buscar</button>
  </div>

  <div class="barraAcciones">
    <button matButton="filled" (click)="agregar()"><mat-icon>add</mat-icon>Agregar</button>
    <button matButton="tonal" (click)="modificar()"><mat-icon>edit</mat-icon>Modificar</button>
    <button matButton="outlined" (click)="eliminar()"><mat-icon>delete</mat-icon>Eliminar</button>
  </div>

  <ngx-datatable class="material" [rows]="festivos()" [columns]="columnas"
                 [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="10"
                 [columnMode]="modoColumna.force" [selectionType]="tipoSeleccion.single"
                 [selected]="seleccion" (selectedChange)="escoger($event)">
  </ngx-datatable>
</div>

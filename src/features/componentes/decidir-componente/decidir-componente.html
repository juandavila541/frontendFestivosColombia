<h2 mat-dialog-title>{{ datos.encabezado }}</h2>
<div mat-dialog-content>
  <p>{{ datos.mensaje }}</p>
</div>
<div mat-dialog-actions align="end">
  <button matButton="outlined" [mat-dialog-close]="false">Cancelar</button>
  <button matButton="filled" [mat-dialog-close]="true">Sí, eliminar</button>
</div>
